[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vorp"
version = "0.1.0"
description = "Static VORP: per-position replacement level and value-over-last-rostered, derived from projections"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["vorp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
