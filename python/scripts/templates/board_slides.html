<title>Live Draft Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
/>
<style>
  /* Fixed dark amber/navy theme, ported from the golden mockup
     (board-slides-golden-new.html) -- this template no longer follows
     prefers-color-scheme; draft_demo.html keeps its own light/dark tokens. */
  :root {
    --ground: #04060e;
    --surface: #0a0f1c;
    --surface-sunk: #121a2e;
    --line: #161d30;
    --line-soft: #232c47;
    --ink: #eef2fb;
    --ink-soft: #8b97b4;
    --ink-faint: #586485;
    --accent: #f2b64c;
    --accent-soft: #241a02;
    --up: #6fe0aa;
    --up-soft: #14312a;
    --down: #fb7185;
    --down-soft: #3a1f19;
    --brass: #f2b64c;
    --qb: #ff9caf;
    --rb: #6fe0aa;
    --wr: #8fbcff;
    --te: #d3bbf7;
    --def: #c1c8d6;
    --radius: 8px;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
    --display: "Barlow Condensed", var(--sans);
  }

  html {
    color-scheme: dark;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 72px; /* room for the floating nav */
  }

  .wrap {
    max-width: 1360px;
    margin: 0 auto;
    padding: 24px 24px 48px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .slide {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .slide[hidden] {
    display: none;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .money {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
  }

  .pos-QB {
    color: var(--qb);
  }
  .pos-RB {
    color: var(--rb);
  }
  .pos-WR {
    color: var(--wr);
  }
  .pos-TE {
    color: var(--te);
  }
  .pos-DEF {
    color: var(--def);
  }

  /* -------------------------------------------------- header / block --- */
  /* Ported from the golden mockup's .uhead: a hero tile (on-block player), a
     splittile (bidding + worth, trimmed to the 3 columns this payload can
     actually fill -- VORP $ / blend / VOLR $, no Sleeper $ or Wk1-3 $), and
     a seatbars tile. Mounted identically on Live (#head-live) and Market
     (#head-market). */

  .pos {
    display: inline-block;
    min-width: 30px;
    text-align: center;
    padding: 1px 6px;
    border-radius: 3px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
  }
  .pos.QB {
    background: #521626;
    color: var(--qb);
  }
  .pos.RB {
    background: #0f3a27;
    color: var(--rb);
  }
  .pos.WR {
    background: #12325f;
    color: var(--wr);
  }
  .pos.TE {
    background: #2b1c49;
    color: var(--te);
  }
  .pos.FLEX,
  .pos.DEF {
    background: #1a2236;
    color: var(--def);
  }

  .uhead {
    display: flex;
    gap: 10px;
    align-items: stretch;
  }
  .kpi {
    flex: 1;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }
  .kpi .klabel {
    font-family: var(--display);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--ink-faint);
    font-weight: 600;
  }
  .kpi b {
    font-family: var(--mono);
    font-size: 1.15rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .kpi b .pnm {
    font-family: var(--sans);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .kpi b.money {
    color: var(--accent);
  }
  .kpi .pos {
    font-size: 0.72rem;
    flex: none;
  }
  .kpi .sub {
    font-size: 0.72rem;
    color: var(--ink-soft);
  }
  .kpi .empty {
    font-size: 1rem;
    color: var(--ink-faint);
    font-style: italic;
  }

  .uhead .kpi.hero {
    flex: 1.8;
  }
  .uhead .kpi.seatile {
    flex: 3.4;
  }

  .kpi.splittile {
    flex: 2.4;
    padding: 4px 10px;
    gap: 4px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .splittile .splitrow {
    display: grid;
    align-items: center;
    column-gap: 12px;
  }
  .splittile .bidrow {
    grid-template-columns: auto repeat(3, 1fr);
    padding-bottom: 3px;
    border-bottom: 1px dotted var(--line);
  }
  .splittile .worthrow {
    grid-template-columns: auto 1fr 78px 1fr;
    padding-top: 3px;
  }
  .splittile .rowlabel {
    font: 700 0.58rem var(--display);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    align-self: stretch;
    display: flex;
    align-items: center;
    padding: 0 2px;
    border-right: 1px solid var(--line);
  }
  .splittile .statcell {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .splittile .statcell .l {
    font: 600 0.6rem var(--display);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-faint);
  }
  .splittile .statcell .v {
    font: 600 0.95rem var(--mono);
    font-variant-numeric: tabular-nums;
    line-height: 1.15;
  }
  .splittile .statcell .v.money {
    color: var(--accent);
  }
  .splittile .statcell .v small {
    color: var(--ink-soft);
    font-weight: 400;
    font-size: 0.68rem;
  }
  .splittile .worth.vorp .v {
    color: var(--accent);
  }
  .splittile .worth.volr .v {
    color: #2dd4da;
  }
  .splittile .blendcell {
    align-self: stretch;
    justify-content: center;
    gap: 4px;
  }
  .splittile .blendcell .l {
    text-align: center;
  }
  .splittile .blendcell .blend-track {
    width: 100%;
  }
  .blend-track {
    position: relative;
    height: 5px;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--accent), #2dd4da);
    opacity: 0.85;
  }
  .blend-track.flat {
    background: var(--line-soft);
  }
  .blend-dot {
    position: absolute;
    top: 50%;
    width: 9px;
    height: 9px;
    margin-top: -4.5px;
    margin-left: -4.5px;
    border-radius: 50%;
    background: var(--ink);
    box-shadow: 0 0 0 2px var(--surface);
  }

  .seatbars {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    flex: 1;
    min-height: 46px;
    margin-top: 3px;
  }
  .seatbars .sb {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 1px;
    min-width: 0;
    height: 100%;
  }
  .seatbars .sb .sv {
    font-family: var(--mono);
    font-size: 0.56rem;
    font-variant-numeric: tabular-nums;
    color: transparent;
    line-height: 1;
  }
  .seatbars .sb i {
    display: block;
    width: 100%;
    min-height: 2px;
    background: var(--surface-sunk);
    border-radius: 2px 2px 0 0;
  }
  .seatbars .sb .sl {
    font-family: var(--mono);
    font-size: 0.54rem;
    color: var(--ink-faint);
    line-height: 1;
  }
  .seatbars .sb.me i {
    background: var(--accent);
  }
  .seatbars .sb.me .sv,
  .seatbars .sb.me .sl {
    color: var(--accent);
    font-weight: 700;
  }
  .seatbars .sb.setter i {
    background: var(--ink-soft);
  }
  .seatbars .sb.setter .sv {
    color: var(--ink);
  }
  .seatbars .sb.win i {
    background: var(--up);
  }
  .seatbars .sb.win .sv {
    color: var(--up);
    font-weight: 700;
  }
  .seatbars .sb.exp i {
    background: transparent;
    border: 1px dashed var(--up);
  }
  .seatbars .sb.exp .sv,
  .seatbars .sb.exp .sl {
    color: var(--up);
    font-weight: 700;
  }
  .seatbars .sb.divedge {
    margin-left: 6px;
    border-left: 1px solid var(--line);
    padding-left: 4px;
  }
  .seatbars .sb.divedge:first-child {
    margin-left: 0;
    border-left: 0;
    padding-left: 0;
  }

  /* --------------------------------------------------- buying power ---- */
  /* Ported from golden's .barrow/.bar -- height by max_bid only, no
     bid-activity recency fill or lead-count pill (no bid-ladder data
     exists server-side to drive those). A .tagsrow of desperation pips
     sits below: how many of the on-block position each seat still needs. */

  .barrow {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    height: 90px;
    border-bottom: 1px solid var(--line);
    padding-top: 22px;
  }
  .bar {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    height: 100%;
  }
  .bar .amt {
    font-family: var(--mono);
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 3px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .bar i {
    display: block;
    width: 100%;
    min-height: 3px;
    background: var(--surface-sunk);
    border-radius: 2px 2px 0 0;
    flex-shrink: 0;
  }
  .bar.mine i {
    background: var(--accent);
  }
  .power-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-faint);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tagsrow {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }
  .tagsrow .tagcell {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .tagsrow .tagname {
    max-width: 100%;
    text-align: center;
    font-size: 0.76rem;
    color: var(--ink-faint);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .tagsrow .tagcell.me .tagname {
    color: var(--ink);
    font-weight: 700;
  }
  .tagsrow .tagcell.me .tagname::before {
    content: "\25B8 ";
    color: var(--accent);
  }
  .pip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 20px;
    height: 18px;
    padding: 0 5px;
    border-radius: 9px;
    background: var(--surface-sunk);
    color: var(--ink-soft);
    font-family: var(--mono);
    font-size: 0.72rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  /* desperation ramp: --d (0..1) mixes the position colour --pc into the
     pip; done = satisfied (recedes), empty/part = still wants one, hotter
     the emptier the seat is at this position. */
  .pip.done {
    background: var(--surface-sunk);
    color: var(--ink-faint);
  }
  .pip.part,
  .pip.empty {
    background: color-mix(in srgb, var(--pc) calc(var(--d) * 100%), var(--surface-sunk));
    color: var(--ink);
  }
  .pip.empty {
    color: #fff;
    font-weight: 800;
    box-shadow: 0 0 0 1.5px var(--pc);
  }

  /* --------------------------------------------------------- nav --------- */

  .nav {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
    z-index: 10;
  }
  .nav button {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
  }
  .nav button.active {
    background: var(--accent);
    color: white;
  }

  .scrub-bar {
    position: fixed;
    bottom: 68px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 16px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
    z-index: 10;
    width: min(90vw, 480px);
  }
  .scrub-bar input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
  }
  .scrub-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
    white-space: nowrap;
  }
  .scrub-bar button {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    border: 1px solid var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
    padding: 4px 10px;
    border-radius: 999px;
    cursor: pointer;
  }

  .placeholder {
    color: var(--ink-faint);
    font-style: italic;
    padding: 24px;
    text-align: center;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th,
  td {
    text-align: left;
    padding: 6px 8px;
    border-bottom: 1px solid var(--line-soft);
  }
  th {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-faint);
    font-weight: 500;
    white-space: nowrap;
  }
  #matrix th {
    cursor: pointer;
    user-select: none;
  }
  #matrix th:hover {
    color: var(--ink);
  }
  .scroller {
    overflow-x: auto;
  }

  /* ------------------------------------------------------- pool matrix -- */

  .poolhd {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .filters {
    display: flex;
    gap: 6px;
  }
  .filters button {
    background: var(--surface);
    color: var(--ink-soft);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 4px 13px;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 0.74rem;
    font-weight: 600;
  }
  .filters button:hover {
    color: var(--ink);
    border-color: var(--ink-soft);
  }
  .filters button.active {
    background: var(--accent);
    color: var(--accent-soft);
    border-color: var(--accent);
  }
  .knob {
    flex: 1 1 auto;
    min-width: 260px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 5px 12px;
    border: 1px solid var(--line);
    border-radius: 20px;
  }
  .knob input[type="range"] {
    flex: 1 1 auto;
    width: auto;
    min-width: 80px;
    margin: 0;
  }
  .knob .klabel {
    font-family: var(--display);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }
  .knob .klabel.vorp {
    color: var(--accent);
  }
  .knob .klabel.volr {
    color: #2dd4da;
  }
  .knob-readout {
    margin: 0;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  .knob-readout b {
    color: var(--accent);
  }
  .knob-readout i {
    color: #2dd4da;
    font-style: normal;
  }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--accent), #2dd4da);
    outline: none;
    margin: 0;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--ink);
    border: 3px solid var(--ground);
    box-shadow: 0 0 0 1px var(--line-soft);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--ink);
    border: 3px solid var(--ground);
    cursor: pointer;
  }

  .col-vorp {
    color: var(--accent);
  }
  .col-volr {
    color: #2dd4da;
  }
  td.vorp {
    color: var(--accent);
  }
  td.volr {
    color: #2dd4da;
  }
  td.blend {
    padding-left: 4px;
    padding-right: 4px;
    width: 92px;
  }

  td.seat {
    min-width: 30px;
    text-align: right;
    color: var(--ink-soft);
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
  }
  td.seat.out {
    color: var(--ink-faint);
  }
  th.mecol,
  td.mecol {
    background: rgba(255, 255, 255, 0.04);
  }
  td.seat.win {
    background: var(--up);
    color: var(--ground);
    font-weight: 700;
  }
  td.seat.setter {
    text-decoration: underline dashed;
    text-underline-offset: 3px;
    text-decoration-color: var(--ink-soft);
  }
  th.expwin,
  td.expwin {
    border-left: 1px solid var(--line-soft);
  }
  td.expwin {
    color: var(--up);
    font-weight: 700;
    font-family: var(--mono);
    text-align: right;
  }
  th.seat.divedge,
  td.seat.divedge {
    border-left: 2px solid var(--line);
  }
  .num {
    text-align: right;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
  }
  tr.open td {
    color: var(--ink-faint);
    font-style: italic;
  }
  tr.bench {
    opacity: 0.55;
  }

  /* ---------------------------------- live-bottom: rosters + run pressure */

  .live-bottom {
    flex: 1;
    display: flex;
    gap: 12px;
    min-height: 360px;
  }
  .rosterbox {
    flex: 0 0 17vw;
    min-width: 220px;
    display: flex;
    flex-direction: column;
  }
  .bidderbox {
    border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
  }
  .miniwrap {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
  }
  .pressbox {
    flex: 2;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .presscards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    flex: 1;
    min-height: 0;
  }
  .presscard {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface-sunk);
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    min-height: 0;
  }
  .presscard .cap {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 0.95rem;
    font-weight: 600;
  }
  .presscard .cliff {
    font-family: var(--mono);
    font-size: 0.85rem;
    color: var(--ink-soft);
  }
  .presscard .cliff b {
    color: var(--ink);
  }
  .availlist {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    margin-top: 1px;
  }
  .availhd {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 42px 42px 38px;
    gap: 8px;
    position: sticky;
    top: 0;
    z-index: 1;
    background: var(--surface-sunk);
    padding: 3px 2px;
    border-bottom: 1px solid var(--line);
    font-family: var(--display);
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
  }
  .availhd span {
    text-align: right;
    white-space: nowrap;
  }
  .availhd span:first-child {
    text-align: left;
  }
  .availhd .vd {
    color: var(--accent);
  }

  .availrow {

  .availrow .vd,
  .availrow .ld,
  .availrow .proj {

    text-align: right;
    font-variant-numeric: tabular-nums;

  .availrow .vd {

  .availrow .ld {

  .cliffline {
    margin: 3px 0;
    padding: 3px 0 2px;
    text-align: center;

  /* draft-state "market so far / still on board" grouped table */

  /* --------------------------------------------------------- rosters --- */
  /* Ported from golden's .rbands/.rband/.rail/.rgrid4/.rcard: one row per
     division, a stacked-letter rail, a 4-card grid. Each card is a fixed
     head over a scrolling masked body of slotRows -- trimmed to 4 columns
     (Pos/Player/Proj/Paid; bought players carry no bye and no per-line VORP
     number, only season points). */

  .rbands {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .rband {
    display: flex;
    flex-direction: row;

  .rband.mine {

  .rband .rail {
    flex: none;

  .rband .rail .divname {
    display: flex;

  .rgrid4 {
    display: grid;

    gap: 10px;

    min-width: 0;

  @media (max-width: 900px) {

  .rcard {
    background: var(--surface);

    display: flex;

  .rcard.mine {

  .rhd1 {

    mask-image: linear-gradient(to bottom, transparent 0, #000 12px, #000 calc(100% - 14px), transparent);

</style>

  <button id="scrub-live" hidden>Live</button>
</div>

<nav class="nav">
  <button data-slide="s-live" class="active">1 Live</button>
  <button data-slide="s-market">2 Market</button>
  <button data-slide="s-rosters">3 Rosters</button>

<script>
  <!-- FILL_SLOTS_JS -->

  const SLIDES = ["s-live", "s-market", "s-rosters"];

  function showSlide(id) {
    for (const s of SLIDES) {
      document.getElementById(s).hidden = s !== id;
    }
    for (const btn of document.querySelectorAll(".nav button")) {
      btn.classList.toggle("active", btn.dataset.slide === id);
    }
  }

  document.querySelectorAll(".nav button").forEach((btn) => {
    btn.addEventListener("click", () => showSlide(btn.dataset.slide));
  });

  document.addEventListener("keydown", (e) => {
    if (e.shiftKey && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
      // Scrub one pick -- guarded by shiftKey so it doesn't also fire the
      // plain-arrow slide navigation below.
      scrubStep(e.key === "ArrowRight" ? 1 : -1);
      e.preventDefault();
    } else if (e.key === "Escape") {
      goLive();
    } else if (e.key === "1" || e.key === "2" || e.key === "3") {
      showSlide(SLIDES[Number(e.key) - 1]);
    } else if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      const current = SLIDES.findIndex((s) => !document.getElementById(s).hidden);
      const delta = e.key === "ArrowRight" ? 1 : -1;
      const next = Math.min(SLIDES.length - 1, Math.max(0, current + delta));
      showSlide(SLIDES[next]);
    }
  });

  function fmtMoney(n) {
    return n === null || n === undefined ? "--" : `$${n}`;
  }

  function seatLabel(payload, seatId) {
    const identity = (payload.seat_users || {})[seatId];
    return (identity && (identity.display_name || identity.username)) || `Seat ${seatId + 1}`;
  }

  function seatOrder(payload) {
    return payload.seat_order || (payload.seats || []).map((s) => s.seat_id);
  }

  // Compact seat label for narrow slots (seat bars, matrix columns): first
  // token, capped so a full division row still fits.
  function seatAbbr(payload, seatId) {
    const label = seatLabel(payload, seatId);
    if (/^Seat \d+$/.test(label)) return "S" + (seatId + 1);
    const first = label.trim().split(/\s+/)[0];
    return first.length > 7 ? first.slice(0, 6) + "…" : first;
  }

  // Seat ids that lead a division band, for a divider border in seat-ordered
  // rows -- empty (no dividers) until identity/divisions are resolved.
  function divisionStarts(payload) {
    const set = new Set();
    for (const dv of payload.divisions || []) if (dv.seats.length) set.add(dv.seats[0]);
    return set;
  }

  function seatById(payload, seatId) {
    return (payload.seats || []).find((s) => s.seat_id === seatId);
  }

  // The block player's own matrix row -- winner/price_setter_bid/expected_price
  // are already computed server-side (seat_matrix's ascending-auction
  // resolution); the client never re-derives them.
  function matrixRowFor(payload, playerId) {
    return (payload.matrix || []).find((r) => r.player_id === playerId);
  }

  // Shared VORP<->VOLR blend weight (1 = pure VORP), moved by the Market
  // slide's blend slider and re-read by the header's blend-track dot.
  let W = 1.0;

  function blendTrack(vorpD, volrD) {
    const flat = vorpD === volrD;
    const left = flat ? 50 : Math.max(0, Math.min(100, (1 - W) * 100));
    return `<div class="blend-track${flat ? " flat" : ""}"><span class="blend-dot" style="left:${left}%"></span></div>`;
  }

  function headerTiles(payload) {
    const block = payload.block;
    if (!block) {
      return `<div class="kpi hero"><span class="klabel">On the block</span>
        <span class="empty">Nobody on the block / waiting on a nomination</span></div>`;
    }
    const posBadge = block.position ? `<span class="pos ${block.position}">${block.position}</span>` : "";
    if (block.sold) {
      // A scrubbed frame's block is the pick that just sold at that prefix --
      // a different, smaller shape (no price/vorp/volr/bids) than a live
      // nomination, so it only gets the hero tile.
      return `<div class="kpi hero"><span class="klabel">Just sold</span>
        <b><span class="pnm">${block.player_id}</span>${posBadge}</b>
        <span class="sub">sold for ${fmtMoney(block.amount)}${
        block.buyer ? ` to ${block.buyer}` : ""
      }</span></div>`;
    }

    const mySeat = payload.my_seat != null ? seatById(payload, payload.my_seat) : null;
    const bidCell = (l, v, sub) =>
      `<div class="statcell"><span class="l">${l}</span>
       <span class="v money">${fmtMoney(v)}${sub ? ` <small>${sub}</small>` : ""}</span></div>`;
    const worthCell = (l, cls, dollar) =>
      `<div class="statcell worth ${cls}"><span class="l">${l}</span>
       <span class="v">${fmtMoney(dollar)}</span></div>`;

    return `<div class="kpi hero"><span class="klabel">On the block</span>
        <b><span class="pnm">${block.player_id}</span>${posBadge}</b>
        <span class="sub">${block.points != null ? `${block.points} pts proj` : ""}</span></div>
      <div class="kpi splittile">
        <div class="splitrow bidrow">
          <span class="rowlabel">Bidding</span>
          ${bidCell("Current bid", block.highest_offer)}
          ${bidCell("My max bid", mySeat ? mySeat.max_bid : null)}
          ${bidCell("Budget left", mySeat ? mySeat.budget_left : null)}
        </div>
        <div class="splitrow worthrow">
          <span class="rowlabel">Worth</span>
          ${worthCell("VORP $", "vorp", block.vorp_dollar)}
          <div class="statcell blendcell"><span class="l">Blend</span>${blendTrack(
            block.vorp_dollar,
            block.volr_dollar
          )}</div>
          ${worthCell("VOLR $", "volr", block.volr_dollar)}
        </div>
      </div>`;
  }

  function renderHeader(payload, mount) {
    if (!mount) return;
    const block = payload.block;
    if (!block || block.sold || !block.bids) {
      mount.innerHTML = headerTiles(payload);
      return;
    }
    const matrixRow = matrixRowFor(payload, block.player_id);
    const winner = matrixRow ? matrixRow.winner : null;
    const setter = matrixRow ? matrixRow.price_setter_bid : null;
    const exp = matrixRow ? matrixRow.expected_price : null;
    const order = seatOrder(payload);
    const bidVals = order.map((sid) => block.bids[sid] || 0);
    const maxV = Math.max(...bidVals, exp || 0, 1);
    const barH = (v) => (v > 0 ? Math.max(6, Math.round((v / maxV) * 100)) : 0);
    const starts = divisionStarts(payload);
    const bars = order
      .map((sid) => {
        const b = block.bids[sid] || 0;
        const cls = ["sb"];
        if (sid === winner) cls.push("win");
        else if (setter != null && b === setter) cls.push("setter");
        else if (sid === payload.my_seat) cls.push("me");
        if (starts.has(sid)) cls.push("divedge");
        return `<div class="${cls.join(" ")}"><span class="sv">${
          b > 0 ? fmtMoney(b) : "—"
        }</span><i style="height:${barH(b)}%"></i><span class="sl">${seatAbbr(
          payload,
          sid
        )}</span></div>`;
      })
      .join("");
    const expBar = `<div class="sb exp"><span class="sv">${
      exp != null ? fmtMoney(exp) : ""
    }</span><i style="height:${barH(exp)}%"></i><span class="sl">Exp</span></div>`;
    mount.innerHTML =
      headerTiles(payload) +
      `<div class="kpi seatile"><span class="klabel">Worth to each seat</span><div class="seatbars">${bars}${expBar}</div></div>`;
  }

  function renderPower(payload) {
    const el = document.getElementById("power");
    const order = seatOrder(payload);
    const seatsById = Object.fromEntries((payload.seats || []).map((s) => [s.seat_id, s]));
    const maxOfAll = Math.max(1, ...order.map((sid) => (seatsById[sid] || {}).max_bid || 0));

    el.innerHTML = order
      .map((sid) => {
        const seat = seatsById[sid] || {};
        const pct = Math.max(4, Math.round(((seat.max_bid || 0) / maxOfAll) * 100));
        const mine = sid === payload.my_seat ? " mine" : "";
        return `<div class="bar${mine}"><span class="amt">${fmtMoney(
          seat.max_bid
        )}</span><i style="height:${pct}%"></i></div>`;
      })
      .join("");

    const tagsEl = document.getElementById("power-tags");
    const blockPos = payload.block && payload.block.position;
    const target = blockPos ? (payload.config.starting_slots || {})[blockPos] || 0 : 0;
    if (!blockPos || target <= 0) {
      tagsEl.innerHTML = "";
      return;
    }
    tagsEl.innerHTML = order
      .map((sid) => {
        const seat = seatsById[sid] || { bought: [] };
        const have = seat.bought.filter((b) => b.position === blockPos).length;
        const need = Math.max(0, target - have);
        const d = target > 0 ? need / target : 0;
        const cls = need === 0 ? "done" : have === 0 ? "empty" : "part";
        const mine = sid === payload.my_seat ? " me" : "";
        return `<div class="tagcell${mine}"><span class="tagname">${seatLabel(
          payload,
          sid
        )}</span><span class="pip ${cls}" style="--pc:var(--${blockPos.toLowerCase()});--d:${d.toFixed(
          2
        )}">${have}/${target}</span></div>`;
      })
      .join("");
  }

  const POSITIONS = ["QB", "RB", "WR", "TE", "K", "DEF"];

  function renderStateTable(payload) {
    const el = document.getElementById("state-table");
    const drafted = {};
    const spent = {};
    const vorpGot = {};
    for (const pos of POSITIONS) {
      drafted[pos] = 0;
      spent[pos] = 0;
      vorpGot[pos] = 0;
    }
    const levels = payload.levels || {};
    for (const seat of payload.seats || []) {
      for (const b of seat.bought) {
        drafted[b.position] = (drafted[b.position] || 0) + 1;
        spent[b.position] = (spent[b.position] || 0) + b.amount;
        const replacement = (levels[b.position] || {}).replacement || 0;
        vorpGot[b.position] = (vorpGot[b.position] || 0) + Math.max(0, (b.points || 0) - replacement);
      }
    }
    const vorpLeft = {};
    for (const pos of POSITIONS) vorpLeft[pos] = 0;
    for (const p of payload.players || []) {
      const replacement = (levels[p.position] || {}).replacement || 0;
      vorpLeft[p.position] = (vorpLeft[p.position] || 0) + Math.max(0, (p.points || 0) - replacement);
    }
    const pct = (gv, lv) => (gv + lv > 0 ? Math.round((100 * lv) / (gv + lv)) : 0);

    const positions = Object.keys(levels);
    let totalDrafted = 0,
      totalSpent = 0,
      totalGot = 0,
      totalLeft = 0;
    const rows = positions
      .map((pos) => {
        const level = levels[pos];
        const got = vorpGot[pos] || 0,
          left = vorpLeft[pos] || 0;
        totalDrafted += drafted[pos] || 0;
        totalSpent += spent[pos] || 0;
        totalGot += got;
        totalLeft += left;
        return `
        <tr>
          <td><span class="pos ${pos}">${pos}</span></td>
          <td class="num">${drafted[pos] || 0}</td>
          <td class="num money">${fmtMoney(spent[pos] || 0)}</td>
          <td class="num">${Math.round(got)}</td>
          <td class="num gb">${level.replacement.toFixed(1)}</td>
          <td class="num gb">${Math.round(left)}</td>
          <td class="num">${pct(got, left)}%</td>
        </tr>
      `;
      })
      .join("");

    el.innerHTML = `
      <table>
        <thead>
          <tr class="grouptop"><th></th><th class="num" colspan="3">Market so far</th><th class="num gb">Replacement</th><th class="num gb" colspan="2">Still on the board</th></tr>
          <tr><th>Pos</th><th class="num">Drafted</th><th class="num">$ spent</th><th class="num">VORP got</th><th class="num gb">Bar (pts)</th><th class="num gb">VORP left</th><th class="num">% left</th></tr>
        </thead>
        <tbody>${rows}</tbody>
        <tfoot>
          <tr><td>Total</td><td class="num">${totalDrafted}</td><td class="num money">${fmtMoney(
      totalSpent
    )}</td><td class="num">${Math.round(totalGot)}</td><td class="num gb"></td><td class="num gb">${Math.round(
      totalLeft
    )}</td><td class="num">${pct(totalGot, totalLeft)}%</td></tr>
        </tfoot>
      </table>
    `;
  }

  // Bargain/expected-price sort state persists across renders so a poll
  // refresh doesn't reset the user's chosen column.
  let matrixSortKey = "price";
  let matrixSortDir = -1;
  let matrixPosFilter = "ALL";

  function renderMatrix(payload) {
    const el = document.getElementById("matrix");
    const byId = Object.fromEntries((payload.players || []).map((p) => [p.player_id, p]));

    let rows = [...(payload.matrix || [])];
    if (matrixPosFilter !== "ALL") {
      rows = rows.filter((r) => (byId[r.player_id] || {}).position === matrixPosFilter);
    }
    rows.sort((a, b) => {
      const key = matrixSortKey;
      const av =
        key === "position"
          ? (byId[a.player_id] || {}).position || ""
          : a[key] ?? (byId[a.player_id] || {})[key] ?? 0;
      const bv =
        key === "position"
          ? (byId[b.player_id] || {}).position || ""
          : b[key] ?? (byId[b.player_id] || {})[key] ?? 0;
      if (av < bv) return -1 * matrixSortDir;
      if (av > bv) return 1 * matrixSortDir;
      return 0;
    });

    const cols = [
      ["player_id", "Player"],
      ["position", "Pos"],
      ["price", "Sleeper $"],
      ["vorp_dollar", "VORP $"],
      ["volr_dollar", "VOLR $"],
      ["expected_price", "Exp win"],
    ];
    const starts = divisionStarts(payload);
    const order = seatOrder(payload);
    const sortArrow = (key) => (matrixSortKey === key ? (matrixSortDir === -1 ? " ↓" : " ↑") : "");
    const head =
      cols
        .slice(0, 3)
        .map(([key, label]) => `<th data-key="${key}">${label}${sortArrow(key)}</th>`)
        .join("") +
      `<th style="text-align:center">Blend</th>` +
      `<th class="col-volr" data-key="volr_dollar">VOLR $${sortArrow("volr_dollar")}</th>` +
      order
        .map((sid) => {
          const me = sid === payload.my_seat ? " mecol me" : "";
          const edge = starts.has(sid) ? " divedge" : "";
          return `<th class="num seat${me}${edge}">${seatAbbr(payload, sid)}${sid === payload.my_seat ? "*" : ""}</th>`;
        })
        .join("") +
      `<th class="num expwin" data-key="expected_price">Exp win${sortArrow("expected_price")}</th>`;

    const body = rows
      .map((row) => {
        const p = byId[row.player_id] || {};
        const seatCells = order
          .map((sid) => {
            const b = row.bids ? row.bids[sid] : undefined;
            const cls = ["seat"];
            if (sid === payload.my_seat) cls.push("mecol");
            if (!b || b <= 0) cls.push("out");
            if (sid === row.winner) cls.push("win");
            else if (row.price_setter_bid && b === row.price_setter_bid) cls.push("setter");
            if (starts.has(sid)) cls.push("divedge");
            return `<td class="${cls.join(" ")}">${b > 0 ? fmtMoney(b) : "—"}</td>`;
          })
          .join("");
        return `
        <tr>
          <td><span class="pos ${p.position || ""}">${p.position || ""}</span></td>
          <td class="name">${row.player_id}</td>
          <td class="num money">${fmtMoney(row.price)}</td>
          <td class="num vorp">${fmtMoney(p.vorp_dollar)}</td>
          <td class="blend">${blendTrack(p.vorp_dollar, p.volr_dollar)}</td>
          <td class="num volr">${fmtMoney(p.volr_dollar)}</td>
          ${seatCells}
          <td class="expwin">${fmtMoney(row.expected_price)}</td>
        </tr>
      `;
      })
      .join("");

    el.innerHTML = `
      <div class="poolhd">
        <div class="filters" id="matrix-posfilter">
          ${["ALL", "QB", "RB", "WR", "TE"]
            .map(
              (pos) =>
                `<button type="button" data-pos="${pos}" class="${
                  matrixPosFilter === pos ? "active" : ""
                }">${pos === "ALL" ? "All" : pos}</button>`
            )
            .join("")}
        </div>
        <div class="knob">
          <span class="klabel vorp">VORP $</span>
          <input type="range" id="matrix-blend" min="0" max="100" step="5" value="${Math.round((1 - W) * 100)}" />
          <span class="klabel volr">VOLR $</span>
          <span class="knob-readout"><b id="matrix-pctVorp">${Math.round(W * 100)}%</b> VORP / <i id="matrix-pctVolr">${Math.round(
      (1 - W) * 100
    )}%</i> VOLR</span>
        </div>
      </div>
      <div class="scroller">
        <table>
          <thead><tr>${head}</tr></thead>
          <tbody>${body}</tbody>
        </table>
      </div>
    `;

    el.querySelectorAll("#matrix-posfilter button").forEach((btn) => {
      btn.addEventListener("click", () => {
        matrixPosFilter = btn.dataset.pos;
        renderMatrix(payload);
      });
    });
    const blendSlider = el.querySelector("#matrix-blend");
    blendSlider.addEventListener("input", () => {
      W = 1 - +blendSlider.value / 100;
      renderMatrix(payload);
      renderHeader(payload, document.getElementById("head-live"));
      renderHeader(payload, document.getElementById("head-market"));
    });

    el.querySelectorAll("th[data-key]").forEach((th) => {
      th.addEventListener("click", () => {
        const key = th.dataset.key;
        if (matrixSortKey === key) {
          matrixSortDir *= -1;
        } else {
          matrixSortKey = key;
          matrixSortDir = -1;
        }
        renderMatrix(payload);
      });
    });
  }

  const FLEX_ELIGIBILITY = {
    FLEX: ["RB", "WR", "TE"],
    REC_FLEX: ["WR", "TE"],
    SUPER_FLEX: ["QB", "RB", "WR", "TE"],
  };

  // Mirrors LeagueState.seat_slots(bench=False) -- python/vorp/league/teams.py
  // -- starting slots only, built from the payload's own config so this
  // never drifts from the real league template.
  function startingSlots(config) {
    const slots = [];
    let nextId = 0;
    for (const pos of POSITIONS) {
      const count = (config.starting_slots || {})[pos] || 0;
      for (let i = 0; i < count; i++) slots.push({ id: nextId++, eligiblePositions: [pos], flexLabel: pos });
    }
    for (const [flex, count] of Object.entries(config.flex_slots || {})) {
      for (let i = 0; i < count; i++) {
        slots.push({ id: nextId++, eligiblePositions: FLEX_ELIGIBILITY[flex], flexLabel: flex });
      }
    }
    return slots;
  }

  // Two tables share an identical <colgroup> so the fixed head lines up
  // with the scrolling, mask-faded body beneath it.
  const RCARD_COLS = '<colgroup><col style="width:38px"><col><col style="width:44px"><col style="width:46px"></colgroup>';

  function rcard(payload, seat, sid) {
    const pct = seat.budget_left + seat.bought.reduce((n, b) => n + b.amount, 0);
    const pctFill = pct > 0 ? Math.round((seat.budget_left / pct) * 100) : 0;
    const mine = sid === payload.my_seat ? " mine" : "";
    return `<div class="rcard${mine}">
      <div class="rhd1"><b>${seatLabel(payload, sid)}</b>
        <span class="meta"><span class="left">${fmtMoney(seat.budget_left)}</span><span>left</span></span></div>
      <div class="budget"><i style="width:${pctFill}%"></i></div>
      <table class="rtbl-head">${RCARD_COLS}
        <thead><tr><th>Pos</th><th>Player</th><th class="num">Proj</th><th class="num">Paid</th></tr></thead>
      </table>
      <div class="rtblwrap"><table>${RCARD_COLS}
        <tbody>${slotRows(seat, startingSlots(payload.config || {}), false)}</tbody></table></div></div>`;
  }

  function renderRosters(payload) {
    const el = document.getElementById("rosters");
    const seatsById = Object.fromEntries((payload.seats || []).map((s) => [s.seat_id, s]));
    const divisions = payload.divisions || [
      { name: "All seats", index: 0, mine: false, seats: (payload.seats || []).map((s) => s.seat_id) },
    ];

    el.innerHTML = `<div class="rbands">${divisions
      .map((division) => {
        const letters = (division.name || "")
          .split("")
          .map((c) => `<span>${c}</span>`)
          .join("");
        const cards = division.seats
          .map((sid) => rcard(payload, seatsById[sid] || { budget_left: 0, bought: [] }, sid))
          .join("");
        return `<div class="rband${division.mine ? " mine" : ""}">
          <div class="rail"><span class="divname">${letters}</span></div>
          <div class="rgrid4">${cards}</div>
        </div>`;
      })
      .join("")}</div>`;
  }

  const SKILL_POS = ["QB", "RB", "WR", "TE"];
  const SLOT_LABEL = { FLEX: "FLEX", REC_FLEX: "WR/TE", SUPER_FLEX: "SFLEX", BN: "BN" };

  function posClassFor(pos) {
    return SKILL_POS.includes(pos) ? pos : pos === "DEF" ? "DEF" : "FLEX";
  }
  function posBadgeHtml(pos) {
    return `<span class="pos ${posClassFor(pos)}">${pos}</span>`;
  }
  function slotBadgeHtml(label) {
    return `<span class="pos ${posClassFor(label)}">${SLOT_LABEL[label] || label}</span>`;
  }

  // A seat's roster as slot-filled rows via the shared fillSlots (open slots
  // show the slot label; a flex slot shows the seated player's own position
  // color under the flex label; bench -- unseated -- players are dimmed).
  // `mini` drops the Proj column for the narrow Live-slide cards.
  function slotRows(seat, slotsTemplate, mini) {
    const bought = seat.bought || [];
    const players = bought.map((b) => ({ playerId: b.player_id, position: b.position, points: b.points }));
    const seated = fillSlots(players, slotsTemplate);
    const seatedIds = new Set(seated.values());
    const boughtById = Object.fromEntries(bought.map((b) => [b.player_id, b]));
    const bench = bought.filter((b) => !seatedIds.has(b.player_id));

    const row = (badge, b, cls) =>
      mini
        ? `<tr class="${cls}"><td>${badge}</td><td class="name">${
            b ? b.player_id : "— open —"
          }</td><td class="num money">${b ? fmtMoney(b.amount) : ""}</td></tr>`
        : `<tr class="${cls}"><td>${badge}</td><td class="name">${
            b ? b.player_id : "— open —"
          }</td><td class="num">${b ? b.points : ""}</td><td class="num money">${
            b ? fmtMoney(b.amount) : ""
          }</td></tr>`;

    const starterRows = slotsTemplate
      .map((slot) => {
        const pid = seated.get(slot.id);
        if (!pid) return row(slotBadgeHtml(slot.flexLabel), null, "open");
        const b = boughtById[pid];
        const isFlex = slot.eligiblePositions && slot.eligiblePositions.length > 1;
        const badge = isFlex
          ? `<span class="pos ${posClassFor(b.position)}">${SLOT_LABEL[slot.flexLabel] || slot.flexLabel}</span>`
          : posBadgeHtml(b.position);
        return row(badge, b, "");
      })
      .join("");
    const benchRows = bench.map((b) => row(posBadgeHtml(b.position), b, "bench")).join("");
    return starterRows + benchRows;
  }

  // Serves both "My roster" and "High bidder's roster" -- same slot-fill,
  // different seat.
  function renderMiniRoster(payload, seatId, bodyId, labelId, labelText) {
    const body = document.getElementById(bodyId);
    const label = document.getElementById(labelId);
    const seat = seatId != null ? seatById(payload, seatId) : null;
    if (!seat) {
      label.textContent = labelText;
      body.innerHTML = "";
      return;
    }
    const mine = seatId === payload.my_seat ? " (me)" : "";
    label.textContent = `${labelText} — ${seatLabel(payload, seatId)}${mine} · ${fmtMoney(seat.budget_left)} left`;
    body.innerHTML = slotRows(seat, startingSlots(payload.config || {}), true);
  }

  // Run pressure: top-10-by-VORP-$ available players per skill position,
  // with a cliff marker at the biggest point drop -- pure client-side math
  // over payload.players, no server dependency (there's no tier-cliff
  // structure in the payload to consume instead).
  function renderPressCards(payload) {
    const el = document.getElementById("presscards");
    if (!el) return;
    const numSeats = (payload.seats || []).length;
    el.innerHTML = SKILL_POS.map((pos) => {
      const avail = (payload.players || [])
        .filter((p) => p.position === pos)
        .slice()
        .sort((a, b) => (b.vorp_dollar || 0) - (a.vorp_dollar || 0))
        .slice(0, 10);
      let cliffAfter = -1,
        cliffDrop = 0;
      for (let i = 0; i < avail.length - 1; i++) {
        const drop = (avail[i].points || 0) - (avail[i + 1].points || 0);
        if (drop > cliffDrop) {
          cliffDrop = drop;
          cliffAfter = i;
        }
      }
      if (avail.length < 3 || cliffDrop <= 0) cliffAfter = -1;
      const target = ((payload.config || {}).starting_slots || {})[pos] || 0;
      const slots = target * numSeats;
      const drafted = (payload.seats || []).reduce(
        (n, s) => n + s.bought.filter((b) => b.position === pos).length,
        0
      );
      const head = `<div class="availhd"><span>Player</span><span class="vd">VORP $</span><span class="ld">VOLR $</span><span>Proj</span></div>`;
      const rows = avail
        .map((p, i) => {
          const row = `<div class="availrow"><span class="name">${p.player_id}</span><span class="vd">${fmtMoney(
            p.vorp_dollar
          )}</span><span class="ld">${fmtMoney(p.volr_dollar)}</span><i class="proj">${Math.round(
            p.points || 0
          )}</i></div>`;
          return i === cliffAfter
            ? row + `<div class="cliffline">&#9662; -${Math.round(cliffDrop)} pts to next tier</div>`
            : row;
        })
        .join("");
      return (
        `<div class="presscard"><div class="cap"><span class="pos ${pos}">${pos}</span>${avail.length} on the board</div>` +
        `<div class="cliff"><b>${drafted} / ${slots}</b> starters drafted</div>` +
        `<div class="availlist">${head}${rows}</div></div>`
      );
    }).join("");
  }

  function renderAll(payload) {
    renderHeader(payload, document.getElementById("head-live"));
    renderHeader(payload, document.getElementById("head-market"));
    renderPower(payload);
    renderStateTable(payload);
    renderMatrix(payload);
    renderRosters(payload);
    renderPressCards(payload);
    renderMiniRoster(payload, payload.my_seat, "mini-my", "mini-my-label", "My roster");
    const blockRow = payload.block ? matrixRowFor(payload, payload.block.player_id) : null;
    renderMiniRoster(
      payload,
      blockRow ? blockRow.winner : null,
      "mini-bidder",
      "mini-bidder-label",
      "High bidder's roster"
    );
  }

  window.__renderAll = renderAll; // exposed for a static-payload smoke test

  // ---------------------------------------------------------- poll loop --
  // Adaptive cadence mirroring the server's own poller (--poll/--poll-live,
  // docs/spec/board/01-live-data-ingestion.md): fast while a player is on
  // the block, slow otherwise. Re-renders only when the raw JSON text
  // changes, so an unchanged poll costs a fetch and a string compare, not a
  // DOM rebuild.

  const IDLE_INTERVAL_MS = 750;
  const LIVE_INTERVAL_MS = 200;

  let lastJson = null;
  let lastPayload = null;
  let scrubPick = null; // null = live; otherwise the frozen pick to view

  const scrubInput = document.getElementById("scrub");
  const scrubLabel = document.getElementById("scrub-label");
  const scrubLiveBtn = document.getElementById("scrub-live");

  function updateScrubUI(payload) {
    const view = payload.view || {};
    scrubInput.max = view.total || 0;
    scrubInput.disabled = !view.total;
    if (scrubPick === null) scrubInput.value = view.total || 0;
    scrubLabel.textContent = view.live ? "live" : `pick ${view.pick} / ${view.total}`;
    scrubLiveBtn.hidden = view.live !== false;
  }

  async function fetchAndRender() {
    const url = scrubPick === null ? "/state.json" : `/state.json?upto=${scrubPick}`;
    let text;
    try {
      const res = await fetch(url);
      text = await res.text();
    } catch (err) {
      return; // a network hiccup just skips this tick -- the next poll retries
    }
    if (text === lastJson) return;
    lastJson = text;
    lastPayload = JSON.parse(text);
    renderAll(lastPayload);
    updateScrubUI(lastPayload);
  }

  function goLive() {
    if (scrubPick === null) return;
    scrubPick = null;
    lastJson = null; // force a re-render even if the live text is unchanged
    fetchAndRender();
  }

  function scrubTo(n) {
    const total = (lastPayload && lastPayload.view && lastPayload.view.total) || 0;
    scrubPick = Math.max(0, Math.min(n, total));
    lastJson = null;
    fetchAndRender();
  }

  function scrubStep(delta) {
    const total = (lastPayload && lastPayload.view && lastPayload.view.total) || 0;
    const current = scrubPick === null ? total : scrubPick;
    scrubTo(current + delta);
  }

  scrubInput.addEventListener("input", () => scrubTo(Number(scrubInput.value)));
  scrubLiveBtn.addEventListener("click", goLive);

  async function pollLoop() {
    await fetchAndRender();
    const onBlock = Boolean(lastPayload && lastPayload.block && !lastPayload.block.sold);
    setTimeout(pollLoop, onBlock ? LIVE_INTERVAL_MS : IDLE_INTERVAL_MS);
  }

  pollLoop();
</script>
