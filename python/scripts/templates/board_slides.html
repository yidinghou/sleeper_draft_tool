<title>Live Draft Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
/>
<style>
  /* Fixed dark amber/navy theme, ported from the golden mockup
     (board-slides-golden-new.html) -- this template no longer follows
     prefers-color-scheme; draft_demo.html keeps its own light/dark tokens. */
  :root {
    --ground: #04060e;
    --surface: #0a0f1c;
    --surface-sunk: #121a2e;
    --line: #161d30;
    --line-soft: #232c47;
    --ink: #eef2fb;
    --ink-soft: #8b97b4;
    --ink-faint: #586485;
    --accent: #f2b64c;
    --accent-soft: #241a02;
    --up: #6fe0aa;
    --up-soft: #14312a;
    --down: #fb7185;
    --down-soft: #3a1f19;
    --brass: #f2b64c;
    --qb: #ff9caf;
    --rb: #6fe0aa;
    --wr: #8fbcff;
    --te: #d3bbf7;
    --def: #c1c8d6;
    --radius: 8px;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
    --display: "Barlow Condensed", var(--sans);
  }

  html {
    color-scheme: dark;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 72px; /* room for the floating nav */
  }

  .wrap {
    max-width: 1360px;
    margin: 0 auto;
    padding: 24px 24px 48px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .slide {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .slide[hidden] {
    display: none;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .money {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
  }

  .pos-QB {
    color: var(--qb);
  }
  .pos-RB {
    color: var(--rb);
  }
  .pos-WR {
    color: var(--wr);
  }
  .pos-TE {
    color: var(--te);
  }
  .pos-DEF {
    color: var(--def);
  }

  /* -------------------------------------------------- header / block --- */
  /* Ported from the golden mockup's .uhead: a hero tile (on-block player), a
     splittile (bidding + worth, trimmed to the 3 columns this payload can
     actually fill -- VORP $ / blend / VOLR $, no Sleeper $ or Wk1-3 $), and
     a seatbars tile. Mounted identically on Live (#head-live) and Market
     (#head-market). */

  .pos {
    display: inline-block;
    min-width: 30px;
    text-align: center;
    padding: 1px 6px;
    border-radius: 3px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
  }
  .pos.QB {
    background: #521626;
    color: var(--qb);
  }
  .pos.RB {
    background: #0f3a27;
    color: var(--rb);
  }
  .pos.WR {
    background: #12325f;
    color: var(--wr);
  }
  .pos.TE {
    background: #2b1c49;
    color: var(--te);
  }
  .pos.FLEX,
  .pos.DEF {
    background: #1a2236;
    color: var(--def);
  }

  .uhead {
    display: flex;
    gap: 10px;
    align-items: stretch;
  }
  .kpi {
    flex: 1;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }
  .kpi .klabel {
    font-family: var(--display);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--ink-faint);
    font-weight: 600;
  }
  .kpi b {
    font-family: var(--mono);
    font-size: 1.15rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .kpi b .pnm {
    font-family: var(--sans);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .kpi b.money {
    color: var(--accent);
  }
  .kpi .pos {
    font-size: 0.72rem;
    flex: none;
  }
  .kpi .sub {
    font-size: 0.72rem;
    color: var(--ink-soft);
  }
  .kpi .empty {
    font-size: 1rem;
    color: var(--ink-faint);
    font-style: italic;
  }

  .uhead .kpi.hero {
    flex: 1.8;
  }
  .uhead .kpi.seatile {
    flex: 3.4;
  }

  .kpi.splittile {
    flex: 2.4;
    padding: 4px 10px;
    gap: 4px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .splittile .splitrow {
    display: grid;
    align-items: center;
    column-gap: 12px;
  }
  .splittile .bidrow {
    grid-template-columns: auto repeat(3, 1fr);
    padding-bottom: 3px;
    border-bottom: 1px dotted var(--line);
  }
  .splittile .worthrow {
    grid-template-columns: auto 1fr 78px 1fr;
    padding-top: 3px;
  }
  .splittile .rowlabel {
    font: 700 0.58rem var(--display);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    align-self: stretch;
    display: flex;
    align-items: center;
    padding: 0 2px;
    border-right: 1px solid var(--line);
  }
  .splittile .statcell {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .splittile .statcell .l {
    font: 600 0.6rem var(--display);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-faint);
  }
  .splittile .statcell .v {
    font: 600 0.95rem var(--mono);
    font-variant-numeric: tabular-nums;
    line-height: 1.15;
  }
  .splittile .statcell .v.money {
    color: var(--accent);
  }
  .splittile .statcell .v small {
    color: var(--ink-soft);
    font-weight: 400;
    font-size: 0.68rem;
  }
  .splittile .worth.vorp .v {
    color: var(--accent);
  }
  .splittile .worth.volr .v {
    color: #2dd4da;
  }
  .splittile .blendcell {
    align-self: stretch;
    justify-content: center;
    gap: 4px;
  }
  .splittile .blendcell .l {
    text-align: center;
  }
  .splittile .blendcell .blend-track {
    width: 100%;
  }
  .blend-track {
    position: relative;
    height: 5px;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--accent), #2dd4da);
    opacity: 0.85;
  }
  .blend-track.flat {
    background: var(--line-soft);
  }
  .blend-dot {
    position: absolute;
    top: 50%;
    width: 9px;
    height: 9px;
    margin-top: -4.5px;
    margin-left: -4.5px;
    border-radius: 50%;
    background: var(--ink);
    box-shadow: 0 0 0 2px var(--surface);
  }

  .seatbars {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    flex: 1;
    min-height: 46px;
    margin-top: 3px;
  }
  .seatbars .sb {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 1px;
    min-width: 0;
    height: 100%;
  }
  .seatbars .sb .sv {
    font-family: var(--mono);
    font-size: 0.56rem;
    font-variant-numeric: tabular-nums;
    color: transparent;
    line-height: 1;
  }
  .seatbars .sb i {
    display: block;
    width: 100%;
    min-height: 2px;
    background: var(--surface-sunk);
    border-radius: 2px 2px 0 0;
  }
  .seatbars .sb .sl {
    font-family: var(--mono);
    font-size: 0.54rem;
    color: var(--ink-faint);
    line-height: 1;
  }
  .seatbars .sb.me i {
    background: var(--accent);
  }
  .seatbars .sb.me .sv,
  .seatbars .sb.me .sl {
    color: var(--accent);
    font-weight: 700;
  }
  .seatbars .sb.setter i {
    background: var(--ink-soft);
  }
  .seatbars .sb.setter .sv {
    color: var(--ink);
  }
  .seatbars .sb.win i {
    background: var(--up);
  }
  .seatbars .sb.win .sv {
    color: var(--up);
    font-weight: 700;
  }
  .seatbars .sb.exp i {
    background: transparent;
    border: 1px dashed var(--up);
  }
  .seatbars .sb.exp .sv,
  .seatbars .sb.exp .sl {
    color: var(--up);
    font-weight: 700;
  }
  .seatbars .sb.divedge {
    margin-left: 6px;
    border-left: 1px solid var(--line);
    padding-left: 4px;
  }
  .seatbars .sb.divedge:first-child {
    margin-left: 0;
    border-left: 0;
    padding-left: 0;
  }

  /* --------------------------------------------------- buying power ---- */
  /* Ported from golden's .barrow/.bar -- height by max_bid only, no
     bid-activity recency fill or lead-count pill (no bid-ladder data
     exists server-side to drive those). A .tagsrow of desperation pips
     sits below: how many of the on-block position each seat still needs. */

  .barrow {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    height: 90px;
    border-bottom: 1px solid var(--line);
    padding-top: 22px;
  }
  .bar {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    height: 100%;
  }
  .bar .amt {
    font-family: var(--mono);
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 3px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .bar i {
    display: block;
    width: 100%;
    min-height: 3px;
    background: var(--surface-sunk);
    border-radius: 2px 2px 0 0;
    flex-shrink: 0;
  }
  .bar.mine i {
    background: var(--accent);
  }
  .power-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-faint);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tagsrow {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }
  .tagsrow .tagcell {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .tagsrow .tagname {
    max-width: 100%;
    text-align: center;
    font-size: 0.76rem;
    color: var(--ink-faint);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .tagsrow .tagcell.me .tagname {
    color: var(--ink);
    font-weight: 700;
  }
  .tagsrow .tagcell.me .tagname::before {
    content: "\25B8 ";
    color: var(--accent);
  }
  .pip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 20px;
    height: 18px;
    padding: 0 5px;
    border-radius: 9px;
    background: var(--surface-sunk);
    color: var(--ink-soft);
    font-family: var(--mono);
    font-size: 0.72rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  /* desperation ramp: --d (0..1) mixes the position colour --pc into the
     pip; done = satisfied (recedes), empty/part = still wants one, hotter
     the emptier the seat is at this position. */
  .pip.done {
    background: var(--surface-sunk);
    color: var(--ink-faint);
  }
  .pip.part,
  .pip.empty {
    background: color-mix(in srgb, var(--pc) calc(var(--d) * 100%), var(--surface-sunk));
    color: var(--ink);
  }
  .pip.empty {
    color: #fff;
    font-weight: 800;
    box-shadow: 0 0 0 1.5px var(--pc);
  }

  /* --------------------------------------------------------- nav --------- */

  .nav {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
    z-index: 10;
  }
  .nav button {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
  }
  .nav button.active {
    background: var(--accent);
    color: white;
  }

  .scrub-bar {
    position: fixed;
    bottom: 68px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 16px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
    z-index: 10;
    width: min(90vw, 480px);
  }
  .scrub-bar input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
  }
  .scrub-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
    white-space: nowrap;
  }
  .scrub-bar button {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    border: 1px solid var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
    padding: 4px 10px;
    border-radius: 999px;
    cursor: pointer;
  }

  .placeholder {
    color: var(--ink-faint);
    font-style: italic;
    padding: 24px;
    text-align: center;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th,
  td {
    text-align: left;
    padding: 6px 8px;
    border-bottom: 1px solid var(--line-soft);
  }
  th {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-faint);
    font-weight: 500;
    white-space: nowrap;
  }
  #matrix th {
    cursor: pointer;
    user-select: none;
  }
  #matrix th:hover {
    color: var(--ink);
  }
  .scroller {
    overflow-x: auto;
  }
  .num {
    text-align: right;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
  }

  /* draft-state "market so far / still on board" grouped table */
  #state-table .grouptop th {
    border-bottom: none;
    padding-bottom: 2px;
    color: var(--ink-faint);
    font-size: 10px;
  }
  #state-table td.gb,
  #state-table th.gb {
    border-left: 1px solid var(--line);
  }
  #state-table tfoot td {
    border-top: 2px solid var(--line-soft);
    border-bottom: none;
    font-weight: 600;
  }

  .division {
    margin-bottom: 20px;
  }
  .division .eyebrow {
    margin-bottom: 8px;
  }
  .division.mine .eyebrow {
    color: var(--accent);
  }
  .roster-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  @media (max-width: 900px) {
    .roster-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }
  .roster-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px;
  }
  .roster-card.mine {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
  }
  .roster-card-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-weight: 600;
    margin-bottom: 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line-soft);
  }
  .roster-line {
    font-family: var(--mono);
    font-size: 12px;
    display: flex;
    justify-content: space-between;
    padding: 2px 0;
    color: var(--ink-soft);
  }
  .roster-line.open {
    color: var(--ink-faint);
    font-style: italic;
  }
  .roster-line.bench {
    color: var(--ink-faint);
  }
</style>

<div class="wrap">
  <section class="slide" id="s-live">
    <div class="uhead" id="head-live"></div>
    <div class="card">
      <div class="eyebrow">Buying power</div>
      <div class="barrow" id="power"></div>
      <div class="tagsrow" id="power-tags"></div>
    </div>
    <div class="card">
      <div class="eyebrow">Draft state by position</div>
      <div id="state-table"></div>
    </div>
  </section>

  <section class="slide" id="s-market" hidden>
    <div class="uhead" id="head-market"></div>
    <div class="card">
      <div class="eyebrow">Pool matrix</div>
      <div id="matrix"></div>
    </div>
  </section>

  <section class="slide" id="s-rosters" hidden>
    <div id="rosters"></div>
  </section>
</div>

<div class="scrub-bar">
  <input type="range" id="scrub" min="0" max="0" value="0" disabled />
  <span class="scrub-label" id="scrub-label">live</span>
  <button id="scrub-live" hidden>Live</button>
</div>

<nav class="nav">
  <button data-slide="s-live" class="active">1 Live</button>
  <button data-slide="s-market">2 Market</button>
  <button data-slide="s-rosters">3 Rosters</button>
</nav>

<script>
  <!-- FILL_SLOTS_JS -->

  const SLIDES = ["s-live", "s-market", "s-rosters"];

  function showSlide(id) {
    for (const s of SLIDES) {
      document.getElementById(s).hidden = s !== id;
    }
    for (const btn of document.querySelectorAll(".nav button")) {
      btn.classList.toggle("active", btn.dataset.slide === id);
    }
  }

  document.querySelectorAll(".nav button").forEach((btn) => {
    btn.addEventListener("click", () => showSlide(btn.dataset.slide));
  });

  document.addEventListener("keydown", (e) => {
    if (e.shiftKey && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
      // Scrub one pick -- guarded by shiftKey so it doesn't also fire the
      // plain-arrow slide navigation below.
      scrubStep(e.key === "ArrowRight" ? 1 : -1);
      e.preventDefault();
    } else if (e.key === "Escape") {
      goLive();
    } else if (e.key === "1" || e.key === "2" || e.key === "3") {
      showSlide(SLIDES[Number(e.key) - 1]);
    } else if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      const current = SLIDES.findIndex((s) => !document.getElementById(s).hidden);
      const delta = e.key === "ArrowRight" ? 1 : -1;
      const next = Math.min(SLIDES.length - 1, Math.max(0, current + delta));
      showSlide(SLIDES[next]);
    }
  });

  function fmtMoney(n) {
    return n === null || n === undefined ? "--" : `$${n}`;
  }

  function seatLabel(payload, seatId) {
    const identity = (payload.seat_users || {})[seatId];
    return (identity && (identity.display_name || identity.username)) || `Seat ${seatId + 1}`;
  }

  function seatOrder(payload) {
    return payload.seat_order || (payload.seats || []).map((s) => s.seat_id);
  }

  // Compact seat label for narrow slots (seat bars, matrix columns): first
  // token, capped so a full division row still fits.
  function seatAbbr(payload, seatId) {
    const label = seatLabel(payload, seatId);
    if (/^Seat \d+$/.test(label)) return "S" + (seatId + 1);
    const first = label.trim().split(/\s+/)[0];
    return first.length > 7 ? first.slice(0, 6) + "…" : first;
  }

  // Seat ids that lead a division band, for a divider border in seat-ordered
  // rows -- empty (no dividers) until identity/divisions are resolved.
  function divisionStarts(payload) {
    const set = new Set();
    for (const dv of payload.divisions || []) if (dv.seats.length) set.add(dv.seats[0]);
    return set;
  }

  function seatById(payload, seatId) {
    return (payload.seats || []).find((s) => s.seat_id === seatId);
  }

  // The block player's own matrix row -- winner/price_setter_bid/expected_price
  // are already computed server-side (seat_matrix's ascending-auction
  // resolution); the client never re-derives them.
  function matrixRowFor(payload, playerId) {
    return (payload.matrix || []).find((r) => r.player_id === playerId);
  }

  // Shared VORP<->VOLR blend weight (1 = pure VORP), moved by the Market
  // slide's blend slider and re-read by the header's blend-track dot.
  let W = 1.0;

  function blendTrack(vorpD, volrD) {
    const flat = vorpD === volrD;
    const left = flat ? 50 : Math.max(0, Math.min(100, (1 - W) * 100));
    return `<div class="blend-track${flat ? " flat" : ""}"><span class="blend-dot" style="left:${left}%"></span></div>`;
  }

  function headerTiles(payload) {
    const block = payload.block;
    if (!block) {
      return `<div class="kpi hero"><span class="klabel">On the block</span>
        <span class="empty">Nobody on the block / waiting on a nomination</span></div>`;
    }
    const posBadge = block.position ? `<span class="pos ${block.position}">${block.position}</span>` : "";
    if (block.sold) {
      // A scrubbed frame's block is the pick that just sold at that prefix --
      // a different, smaller shape (no price/vorp/volr/bids) than a live
      // nomination, so it only gets the hero tile.
      return `<div class="kpi hero"><span class="klabel">Just sold</span>
        <b><span class="pnm">${block.player_id}</span>${posBadge}</b>
        <span class="sub">sold for ${fmtMoney(block.amount)}${
        block.buyer ? ` to ${block.buyer}` : ""
      }</span></div>`;
    }

    const mySeat = payload.my_seat != null ? seatById(payload, payload.my_seat) : null;
    const bidCell = (l, v, sub) =>
      `<div class="statcell"><span class="l">${l}</span>
       <span class="v money">${fmtMoney(v)}${sub ? ` <small>${sub}</small>` : ""}</span></div>`;
    const worthCell = (l, cls, dollar) =>
      `<div class="statcell worth ${cls}"><span class="l">${l}</span>
       <span class="v">${fmtMoney(dollar)}</span></div>`;

    return `<div class="kpi hero"><span class="klabel">On the block</span>
        <b><span class="pnm">${block.player_id}</span>${posBadge}</b>
        <span class="sub">${block.points != null ? `${block.points} pts proj` : ""}</span></div>
      <div class="kpi splittile">
        <div class="splitrow bidrow">
          <span class="rowlabel">Bidding</span>
          ${bidCell("Current bid", block.highest_offer)}
          ${bidCell("My max bid", mySeat ? mySeat.max_bid : null)}
          ${bidCell("Budget left", mySeat ? mySeat.budget_left : null)}
        </div>
        <div class="splitrow worthrow">
          <span class="rowlabel">Worth</span>
          ${worthCell("VORP $", "vorp", block.vorp_dollar)}
          <div class="statcell blendcell"><span class="l">Blend</span>${blendTrack(
            block.vorp_dollar,
            block.volr_dollar
          )}</div>
          ${worthCell("VOLR $", "volr", block.volr_dollar)}
        </div>
      </div>`;
  }

  function renderHeader(payload, mount) {
    if (!mount) return;
    const block = payload.block;
    if (!block || block.sold || !block.bids) {
      mount.innerHTML = headerTiles(payload);
      return;
    }
    const matrixRow = matrixRowFor(payload, block.player_id);
    const winner = matrixRow ? matrixRow.winner : null;
    const setter = matrixRow ? matrixRow.price_setter_bid : null;
    const exp = matrixRow ? matrixRow.expected_price : null;
    const order = seatOrder(payload);
    const bidVals = order.map((sid) => block.bids[sid] || 0);
    const maxV = Math.max(...bidVals, exp || 0, 1);
    const barH = (v) => (v > 0 ? Math.max(6, Math.round((v / maxV) * 100)) : 0);
    const starts = divisionStarts(payload);
    const bars = order
      .map((sid) => {
        const b = block.bids[sid] || 0;
        const cls = ["sb"];
        if (sid === winner) cls.push("win");
        else if (setter != null && b === setter) cls.push("setter");
        else if (sid === payload.my_seat) cls.push("me");
        if (starts.has(sid)) cls.push("divedge");
        return `<div class="${cls.join(" ")}"><span class="sv">${
          b > 0 ? fmtMoney(b) : "—"
        }</span><i style="height:${barH(b)}%"></i><span class="sl">${seatAbbr(
          payload,
          sid
        )}</span></div>`;
      })
      .join("");
    const expBar = `<div class="sb exp"><span class="sv">${
      exp != null ? fmtMoney(exp) : ""
    }</span><i style="height:${barH(exp)}%"></i><span class="sl">Exp</span></div>`;
    mount.innerHTML =
      headerTiles(payload) +
      `<div class="kpi seatile"><span class="klabel">Worth to each seat</span><div class="seatbars">${bars}${expBar}</div></div>`;
  }

  function renderPower(payload) {
    const el = document.getElementById("power");
    const order = seatOrder(payload);
    const seatsById = Object.fromEntries((payload.seats || []).map((s) => [s.seat_id, s]));
    const maxOfAll = Math.max(1, ...order.map((sid) => (seatsById[sid] || {}).max_bid || 0));

    el.innerHTML = order
      .map((sid) => {
        const seat = seatsById[sid] || {};
        const pct = Math.max(4, Math.round(((seat.max_bid || 0) / maxOfAll) * 100));
        const mine = sid === payload.my_seat ? " mine" : "";
        return `<div class="bar${mine}"><span class="amt">${fmtMoney(
          seat.max_bid
        )}</span><i style="height:${pct}%"></i></div>`;
      })
      .join("");

    const tagsEl = document.getElementById("power-tags");
    const blockPos = payload.block && payload.block.position;
    const target = blockPos ? (payload.config.starting_slots || {})[blockPos] || 0 : 0;
    if (!blockPos || target <= 0) {
      tagsEl.innerHTML = "";
      return;
    }
    tagsEl.innerHTML = order
      .map((sid) => {
        const seat = seatsById[sid] || { bought: [] };
        const have = seat.bought.filter((b) => b.position === blockPos).length;
        const need = Math.max(0, target - have);
        const d = target > 0 ? need / target : 0;
        const cls = need === 0 ? "done" : have === 0 ? "empty" : "part";
        const mine = sid === payload.my_seat ? " me" : "";
        return `<div class="tagcell${mine}"><span class="tagname">${seatLabel(
          payload,
          sid
        )}</span><span class="pip ${cls}" style="--pc:var(--${blockPos.toLowerCase()});--d:${d.toFixed(
          2
        )}">${have}/${target}</span></div>`;
      })
      .join("");
  }

  const POSITIONS = ["QB", "RB", "WR", "TE", "K", "DEF"];

  function renderStateTable(payload) {
    const el = document.getElementById("state-table");
    const drafted = {};
    const spent = {};
    const vorpGot = {};
    for (const pos of POSITIONS) {
      drafted[pos] = 0;
      spent[pos] = 0;
      vorpGot[pos] = 0;
    }
    const levels = payload.levels || {};
    for (const seat of payload.seats || []) {
      for (const b of seat.bought) {
        drafted[b.position] = (drafted[b.position] || 0) + 1;
        spent[b.position] = (spent[b.position] || 0) + b.amount;
        const replacement = (levels[b.position] || {}).replacement || 0;
        vorpGot[b.position] = (vorpGot[b.position] || 0) + Math.max(0, (b.points || 0) - replacement);
      }
    }
    const vorpLeft = {};
    for (const pos of POSITIONS) vorpLeft[pos] = 0;
    for (const p of payload.players || []) {
      const replacement = (levels[p.position] || {}).replacement || 0;
      vorpLeft[p.position] = (vorpLeft[p.position] || 0) + Math.max(0, (p.points || 0) - replacement);
    }
    const pct = (gv, lv) => (gv + lv > 0 ? Math.round((100 * lv) / (gv + lv)) : 0);

    const positions = Object.keys(levels);
    let totalDrafted = 0,
      totalSpent = 0,
      totalGot = 0,
      totalLeft = 0;
    const rows = positions
      .map((pos) => {
        const level = levels[pos];
        const got = vorpGot[pos] || 0,
          left = vorpLeft[pos] || 0;
        totalDrafted += drafted[pos] || 0;
        totalSpent += spent[pos] || 0;
        totalGot += got;
        totalLeft += left;
        return `
        <tr>
          <td><span class="pos ${pos}">${pos}</span></td>
          <td class="num">${drafted[pos] || 0}</td>
          <td class="num money">${fmtMoney(spent[pos] || 0)}</td>
          <td class="num">${Math.round(got)}</td>
          <td class="num gb">${level.replacement.toFixed(1)}</td>
          <td class="num gb">${Math.round(left)}</td>
          <td class="num">${pct(got, left)}%</td>
        </tr>
      `;
      })
      .join("");

    el.innerHTML = `
      <table>
        <thead>
          <tr class="grouptop"><th></th><th class="num" colspan="3">Market so far</th><th class="num gb">Replacement</th><th class="num gb" colspan="2">Still on the board</th></tr>
          <tr><th>Pos</th><th class="num">Drafted</th><th class="num">$ spent</th><th class="num">VORP got</th><th class="num gb">Bar (pts)</th><th class="num gb">VORP left</th><th class="num">% left</th></tr>
        </thead>
        <tbody>${rows}</tbody>
        <tfoot>
          <tr><td>Total</td><td class="num">${totalDrafted}</td><td class="num money">${fmtMoney(
      totalSpent
    )}</td><td class="num">${Math.round(totalGot)}</td><td class="num gb"></td><td class="num gb">${Math.round(
      totalLeft
    )}</td><td class="num">${pct(totalGot, totalLeft)}%</td></tr>
        </tfoot>
      </table>
    `;
  }

  // Bargain/expected-price sort state persists across renders so a poll
  // refresh doesn't reset the user's chosen column.
  let matrixSortKey = "price";
  let matrixSortDir = -1;

  function renderMatrix(payload) {
    const el = document.getElementById("matrix");
    const byId = Object.fromEntries((payload.players || []).map((p) => [p.player_id, p]));

    const rows = [...(payload.matrix || [])];
    rows.sort((a, b) => {
      const key = matrixSortKey;
      const av = key === "position" ? (byId[a.player_id] || {}).position || "" : a[key] ?? 0;
      const bv = key === "position" ? (byId[b.player_id] || {}).position || "" : b[key] ?? 0;
      if (av < bv) return -1 * matrixSortDir;
      if (av > bv) return 1 * matrixSortDir;
      return 0;
    });

    const cols = [
      ["player_id", "Player"],
      ["position", "Pos"],
      ["price", "Price"],
      ["expected_price", "Expected"],
      ["price_setter_bid", "2nd bid"],
      ["winner", "Winner"],
    ];
    const head = cols
      .map(([key, label]) => `<th data-key="${key}">${label}${matrixSortKey === key ? (matrixSortDir === -1 ? " ↓" : " ↑") : ""}</th>`)
      .join("");

    const body = rows
      .map((row) => {
        const p = byId[row.player_id] || {};
        const winnerLabel =
          row.winner !== null && row.winner !== undefined ? seatLabel(payload, row.winner) : "--";
        return `
        <tr>
          <td>${row.player_id}</td>
          <td class="pos-${p.position || ""}">${p.position || ""}</td>
          <td class="num money">${fmtMoney(row.price)}</td>
          <td class="num money">${fmtMoney(row.expected_price)}</td>
          <td class="num money">${fmtMoney(row.price_setter_bid)}</td>
          <td>${winnerLabel}</td>
        </tr>
      `;
      })
      .join("");

    el.innerHTML = `
      <div class="scroller">
        <table>
          <thead><tr>${head}</tr></thead>
          <tbody>${body}</tbody>
        </table>
      </div>
    `;

    el.querySelectorAll("th").forEach((th) => {
      th.addEventListener("click", () => {
        const key = th.dataset.key;
        if (matrixSortKey === key) {
          matrixSortDir *= -1;
        } else {
          matrixSortKey = key;
          matrixSortDir = -1;
        }
        renderMatrix(payload);
      });
    });
  }

  const FLEX_ELIGIBILITY = {
    FLEX: ["RB", "WR", "TE"],
    REC_FLEX: ["WR", "TE"],
    SUPER_FLEX: ["QB", "RB", "WR", "TE"],
  };

  // Mirrors LeagueState.seat_slots(bench=False) -- python/vorp/league/teams.py
  // -- starting slots only, built from the payload's own config so this
  // never drifts from the real league template.
  function startingSlots(config) {
    const slots = [];
    let nextId = 0;
    for (const pos of POSITIONS) {
      const count = (config.starting_slots || {})[pos] || 0;
      for (let i = 0; i < count; i++) slots.push({ id: nextId++, eligiblePositions: [pos], flexLabel: pos });
    }
    for (const [flex, count] of Object.entries(config.flex_slots || {})) {
      for (let i = 0; i < count; i++) {
        slots.push({ id: nextId++, eligiblePositions: FLEX_ELIGIBILITY[flex], flexLabel: flex });
      }
    }
    return slots;
  }

  function renderRosters(payload) {
    const el = document.getElementById("rosters");
    const seatsById = Object.fromEntries((payload.seats || []).map((s) => [s.seat_id, s]));
    const divisions = payload.divisions || [
      { name: "All seats", index: 0, mine: false, seats: (payload.seats || []).map((s) => s.seat_id) },
    ];
    const slotsTemplate = startingSlots(payload.config || {});

    el.innerHTML = divisions
      .map((division) => {
        const cards = division.seats
          .map((sid) => {
            const seat = seatsById[sid] || { budget_left: 0, bought: [] };
            const players = seat.bought.map((b) => ({
              playerId: b.player_id,
              position: b.position,
              points: b.points,
            }));
            const seated = fillSlots(players, slotsTemplate);
            const seatedIds = new Set(seated.values());
            const bench = seat.bought.filter((b) => !seatedIds.has(b.player_id));

            const lines = slotsTemplate
              .map((slot) => {
                const pid = seated.get(slot.id);
                if (pid) {
                  const b = seat.bought.find((x) => x.player_id === pid);
                  return `<div class="roster-line"><span class="pos-${b.position}">${slot.flexLabel}</span><span>${pid}</span></div>`;
                }
                return `<div class="roster-line open"><span>${slot.flexLabel}</span><span>-- open --</span></div>`;
              })
              .join("");
            const benchLines = bench
              .map((b) => `<div class="roster-line bench"><span class="pos-${b.position}">BN</span><span>${b.player_id}</span></div>`)
              .join("");

            const mine = sid === payload.my_seat ? " mine" : "";
            return `
              <div class="roster-card${mine}">
                <div class="roster-card-head"><span>${seatLabel(payload, sid)}</span><span class="money">$${seat.budget_left}</span></div>
                ${lines}
                ${benchLines}
              </div>
            `;
          })
          .join("");
        const mineClass = division.mine ? " mine" : "";
        return `
          <div class="division${mineClass}">
            <div class="eyebrow">${division.name}</div>
            <div class="roster-grid">${cards}</div>
          </div>
        `;
      })
      .join("");
  }

  function renderAll(payload) {
    renderHeader(payload, document.getElementById("head-live"));
    renderHeader(payload, document.getElementById("head-market"));
    renderPower(payload);
    renderStateTable(payload);
    renderMatrix(payload);
    renderRosters(payload);
  }

  window.__renderAll = renderAll; // exposed for a static-payload smoke test

  // ---------------------------------------------------------- poll loop --
  // Adaptive cadence mirroring the server's own poller (--poll/--poll-live,
  // docs/spec/board/01-live-data-ingestion.md): fast while a player is on
  // the block, slow otherwise. Re-renders only when the raw JSON text
  // changes, so an unchanged poll costs a fetch and a string compare, not a
  // DOM rebuild.

  const IDLE_INTERVAL_MS = 750;
  const LIVE_INTERVAL_MS = 200;

  let lastJson = null;
  let lastPayload = null;
  let scrubPick = null; // null = live; otherwise the frozen pick to view

  const scrubInput = document.getElementById("scrub");
  const scrubLabel = document.getElementById("scrub-label");
  const scrubLiveBtn = document.getElementById("scrub-live");

  function updateScrubUI(payload) {
    const view = payload.view || {};
    scrubInput.max = view.total || 0;
    scrubInput.disabled = !view.total;
    if (scrubPick === null) scrubInput.value = view.total || 0;
    scrubLabel.textContent = view.live ? "live" : `pick ${view.pick} / ${view.total}`;
    scrubLiveBtn.hidden = view.live !== false;
  }

  async function fetchAndRender() {
    const url = scrubPick === null ? "/state.json" : `/state.json?upto=${scrubPick}`;
    let text;
    try {
      const res = await fetch(url);
      text = await res.text();
    } catch (err) {
      return; // a network hiccup just skips this tick -- the next poll retries
    }
    if (text === lastJson) return;
    lastJson = text;
    lastPayload = JSON.parse(text);
    renderAll(lastPayload);
    updateScrubUI(lastPayload);
  }

  function goLive() {
    if (scrubPick === null) return;
    scrubPick = null;
    lastJson = null; // force a re-render even if the live text is unchanged
    fetchAndRender();
  }

  function scrubTo(n) {
    const total = (lastPayload && lastPayload.view && lastPayload.view.total) || 0;
    scrubPick = Math.max(0, Math.min(n, total));
    lastJson = null;
    fetchAndRender();
  }

  function scrubStep(delta) {
    const total = (lastPayload && lastPayload.view && lastPayload.view.total) || 0;
    const current = scrubPick === null ? total : scrubPick;
    scrubTo(current + delta);
  }

  scrubInput.addEventListener("input", () => scrubTo(Number(scrubInput.value)));
  scrubLiveBtn.addEventListener("click", goLive);

  async function pollLoop() {
    await fetchAndRender();
    const onBlock = Boolean(lastPayload && lastPayload.block && !lastPayload.block.sold);
    setTimeout(pollLoop, onBlock ? LIVE_INTERVAL_MS : IDLE_INTERVAL_MS);
  }

  pollLoop();
</script>
